name: ci

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # confix picks a different sed invocation per platform, so both
        # matter - GNU sed on linux, BSD sed on macos
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v5

      - name: show environment
        run: |
          bash --version | head -1
          sed --version 2>/dev/null | head -1 || echo "sed: BSD"

      - name: syntax check
        run: bash -n confix

      - name: run test suite
        run: ./test/run-tests.sh -n
