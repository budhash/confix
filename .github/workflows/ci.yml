name: ci

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # confix picks a different sed invocation per platform, so both
        # matter - GNU sed on linux, BSD sed on macos
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v5

      - name: show environment
        run: |
          bash --version | head -1
          sed --version 2>/dev/null | head -1 || echo "sed: BSD"

      - name: syntax check
        run: bash -n confix

      - name: run test suite
        run: ./test/run-tests.sh -n

      - name: run conformance suite (bash oracle)
        # the shared fixtures whose `expected` is generated from this script;
        # runs on both GNU sed (linux) and BSD sed (macos) to catch drift
        run: ./test/conformance/run-bash.sh

  js:
    name: js library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: docs demo must vendor the current library
        # docs/confix.js is generated from js/src/confix.js (npm run build:docs)
        # and must stay byte-identical, so the demo runs the shipped code
        run: |
          if ! diff -q js/src/confix.js docs/confix.js >/dev/null; then
            echo "::error file=docs/confix.js::docs/confix.js is out of sync with js/src/confix.js - run 'npm run build:docs' in js/"
            exit 1
          fi

      - name: run js tests (conformance + api + cli + parity)
        # the JS port runs the same shared fixtures as the bash oracle, so the
        # two implementations are validated against one identical contract
        working-directory: js
        run: node --test
