name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v5

      - name: syntax check
        run: bash -n sh/confix

      - name: run test suite
        run: ./test/run-tests.sh -n

      - name: smoke test the released artifact
        run: |
          # exercise confix exactly the way the README tells users to
          printf 'environment=qa\n#debug=false\n' > smoke.properties
          ./sh/confix -f smoke.properties "environment=prod" ">debug=true" ">added=1"
          grep -qx 'environment=prod' smoke.properties || { echo "update failed"; exit 1; }
          grep -qx 'debug=true'       smoke.properties || { echo "uncomment failed"; exit 1; }
          grep -qx 'added=1'          smoke.properties || { echo "append failed"; exit 1; }
          echo "smoke test passed"

  release:
    name: publish release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: assemble the release artifact
        run: |
          # the tool lives at sh/confix in the repo; publish it under the name
          # users curl (releases/latest/download/confix), so the install URL is
          # unchanged by the relocation
          cp sh/confix confix
          chmod +x confix

      - name: version in confix must match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -E '^readonly __APPVERSION=' sh/confix | cut -d= -f2 | tr -d ' "')
          echo "tag=$tag  __APPVERSION=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error file=sh/confix::tag $GITHUB_REF_NAME does not match __APPVERSION=$version - bump the version in sh/confix or retag"
            exit 1
          fi

      - name: build checksum
        run: |
          shasum -a 256 confix > confix.sha256
          cat confix.sha256

      - name: collect release notes
        id: notes
        run: |
          previous=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "## confix ${GITHUB_REF_NAME}"
            echo
            echo '### Install'
            echo
            echo '```'
            echo "curl -kL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/confix > confix; chmod +x confix"
            echo '```'
            echo
            if [ -n "$previous" ]; then
              echo "### Changes since ${previous}"
              echo
              git log --no-merges --pretty='- %s' "${previous}..${GITHUB_REF_NAME}"
            else
              echo '### Changes'
              echo
              git log --no-merges --pretty='- %s' -20
            fi
            echo
            echo "Verify the download with \`shasum -a 256 -c confix.sha256\`."
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "confix $GITHUB_REF_NAME" \
            --notes "${{ steps.notes.outputs.notes }}" \
            confix confix.sha256

  # ── homebrew tap (best-effort, ordered last) ───────────────────────────────
  # publish a script-formula to budhash/homebrew-tools so users can:
  #   brew install budhash/tools/confix
  # confix is a bash tool (no GoReleaser), so the formula is generated here and
  # pushed to the shared tap. this needs a cross-repo token (HOMEBREW_TAP_TOKEN);
  # the built-in GITHUB_TOKEN can't reach another repo. if it fails, the GitHub
  # release above and the independent npm release are unaffected.
  brew:
    name: update homebrew tap
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: generate the formula and push it to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          url="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"

          # download the tag tarball and pin its checksum
          curl -fsSL "$url" -o source.tar.gz
          sha="$(sha256sum source.tar.gz | cut -d' ' -f1)"
          echo "url:    $url"
          echo "sha256: $sha"

          # clone the shared tap (GITHUB_TOKEN cannot reach another repo)
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/budhash/homebrew-tools.git" tap
          mkdir -p tap/Formula

          # script-formula: install sh/confix from the source tarball as `confix`
          cat > tap/Formula/confix.rb <<RUBY
          class Confix < Formula
            desc "Edit configuration files in place with a tiny command grammar"
            homepage "https://github.com/budhash/confix"
            url "${url}"
            sha256 "${sha}"
            license "Apache-2.0"
            version "${version}"

            def install
              bin.install "sh/confix" => "confix"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/confix -h")
            end
          end
          RUBY

          echo "----- Formula/confix.rb -----"
          cat tap/Formula/confix.rb

          cd tap
          git config user.name "budhash"
          git config user.email "budhash@gmail.com"
          git add Formula/confix.rb
          if git diff --cached --quiet; then
            echo "formula already up to date; nothing to push"
            exit 0
          fi
          git commit -m "confix ${version}"
          git push
