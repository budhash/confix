name: pr

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # confix picks a different sed invocation per platform, so both
        # matter - GNU sed on linux, BSD sed on macos
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v5

      - name: show environment
        run: |
          bash --version | head -1
          sed --version 2>/dev/null | head -1 || echo "sed: BSD"

      - name: syntax check
        run: bash -n sh/confix

      - name: run test suite
        run: ./test/run-tests.sh -n

      - name: run conformance suite (bash oracle)
        # the shared fixtures whose `expected` is generated from this script;
        # runs on both GNU sed (linux) and BSD sed (macos) to catch drift
        run: ./test/conformance/run-bash.sh

  js:
    name: js library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: docs demo must vendor the current library
        # docs/confix.js is generated from js/src/confix.js (npm run build:docs)
        # and must stay byte-identical, so the demo runs the shipped code
        run: |
          if ! diff -q js/src/confix.js docs/confix.js >/dev/null; then
            echo "::error file=docs/confix.js::docs/confix.js is out of sync with js/src/confix.js - run 'npm run build:docs' in js/"
            exit 1
          fi

      - name: run js tests (conformance + api + cli + parity)
        # the JS port runs the same shared fixtures as the bash oracle, so the
        # two implementations are validated against one identical contract
        working-directory: js
        run: node --test

  guards:
    name: repo guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # the fixture guard diffs against the base branch
          fetch-depth: 0

      - name: confix must actually invoke main
        run: |
          # the 2021 refactor shipped a commented-out "#main $@", turning
          # confix into a silent no-op. bash -n cannot catch that, so
          # check the call is present and uncommented.
          if ! grep -qE '^[[:space:]]*main[[:space:]]+"\$@"' sh/confix; then
            echo "::error file=sh/confix::confix does not invoke main - it would be a silent no-op"
            exit 1
          fi

      - name: confix must stay a single self-contained file
        run: |
          # the install story is "curl > confix; chmod +x confix", so the
          # tool must never source or dot-include a sibling file
          if grep -nE '^[[:space:]]*(source|\.)[[:space:]]+' sh/confix; then
            echo "::error file=sh/confix::confix sources an external file - it must stay self-contained"
            exit 1
          fi

      - name: confix must be executable
        run: test -x sh/confix || { echo "::error file=sh/confix::confix is not executable"; exit 1; }

      - name: fixtures must be untouched
        run: |
          # tests assert against exact fixture bytes, including trailing
          # newlines - changing one silently rewrites expectations
          if ! git diff --quiet origin/${{ github.base_ref }} HEAD -- test/data; then
            echo "::warning::test/data fixtures changed in this PR - confirm this was deliberate"
            git diff --stat origin/${{ github.base_ref }} HEAD -- test/data
          fi

  shellcheck:
    name: shellcheck (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: run shellcheck
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s bash confix test/run-tests.sh test/lib/testlib.sh || true
