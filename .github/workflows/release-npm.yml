name: release-npm

# Publishes the @budhash/confix npm package via npm Trusted Publishing (OIDC):
# no stored token, no NPM_TOKEN secret. GitHub Actions mints a short-lived
# identity token that npm verifies against the trusted publisher configured on
# the package (npmjs.com -> @budhash/confix -> Settings -> Trusted Publisher:
# repo budhash/confix, workflow release-npm.yml). Provenance is automatic.
#
# This channel is independent of the bash script's `v*` release (release.yml):
# the package versions on its own `js-v*` tags, e.g.
#   git tag js-v2.0.0 && git push origin js-v2.0.0

on:
  push:
    tags: [ 'js-v*' ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing (and provenance)

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: use an npm that supports trusted publishing
        # trusted publishing needs npm >= 11.5.1; node 20 ships an older npm
        run: npm install -g npm@latest

      - name: tag must match the package version
        run: |
          # tag js-vX.Y.Z must match the version in js/package.json
          tag="${GITHUB_REF_NAME#js-v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error file=js/package.json::tag $GITHUB_REF_NAME does not match version $pkg - bump js/package.json or retag"
            exit 1
          fi

      - name: run tests (conformance + api + cli + parity)
        run: node --test

      - name: verify packaged contents
        run: npm pack --dry-run

      - name: publish (trusted publishing, no token)
        run: npm publish --access public
